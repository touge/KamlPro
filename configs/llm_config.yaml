# ============================================================================
# LLM 统一大模型提供商与路由配置
# ============================================================================
# 声明大模型的底座提供商。包含本地微服务与云端 API 服务。
# 支持 ${ENV_VAR} 语法加载环境变量中的密钥凭证。

providers:
  # 🟢 本地离线推理服务 (Ollama)
  ollama:
    type: "ollama"
    base_url: "http://127.0.0.1:11434"
    api_key: ""
    models:
      - name: "gemma3:12b"
        tier: "sentinel"
        display_name: "Gemma 3 (本地离线 / 12B)"
      - name: "qwen3:14b"
        tier: "sentinel"
        display_name: "通义千问 3 (本地离线 / 14B)"

  # 🔵 线上 DeepSeek 官方 API (兼容 OpenAI 接口协议)
  deepseek:
    type: "openai_compatible"
    base_url: "https://api.deepseek.com"
    api_key: "${DEEPSEEK_API_KEY}"
    models:
      - name: "deepseek-v4-flash"
        tier: "value"
        display_name: "DeepSeek V4 Flash (极速 / 降本首选)"
      - name: "deepseek-v4-pro"
        tier: "premium"
        display_name: "DeepSeek V4 Pro (高保真 / 旗舰思考)"

  # 🟠 自发现演示用的 Mock 提供商 (Drop & Play)
  # mock_test_provider:
  #   type: "mock_test"
  #   models:
  #     - name: "mock-auto-model"
  #       tier: "sentinel"
  #       display_name: "Mock 自动发现模型"

# ============================================================================
# 全局大模型调度配置 (单层扁平化配置)
# ============================================================================
api_concurrency_limit: 1     # 云端 API 并发限制（设为 2 便于多轮排队测试）
