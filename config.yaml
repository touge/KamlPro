# ============================================================================
# Kalm 主配置文件
# ============================================================================
# 此文件是 Kalm 平台的核心配置，控制 API 服务、自动启动服务和基础路径等行为。
# 所有的任务定义、LLM提供商、模型列表以及路径/后缀映射等，均已模块化抽离到 `configs/` 目录中。
# 支持 `${ENV_VAR}` 语法引用环境变量，例如: `${API_TOKEN}`
#
# 修改配置后需要重启 Kalm 服务才能生效。
# ============================================================================

# ============================================================================
# 引入模块化外部配置文件 (直接键值对形式映射)
# ============================================================================
model_extensions: "configs/model_extensions.yaml"
tasks: "configs/tasks.yaml"
llm_providers: "configs/llm_config.yaml"

# ============================================================================
# 应用基本信息
# ============================================================================
app:
  name: "Kalm"                    # 应用名称，显示在日志和 API 信息中
  version: "1.0.0"                # 应用版本号
  debug: true                     # 调试模式开关

# ----------------------------------------------------------------------------
# API 服务配置
# ----------------------------------------------------------------------------
api_server:
  host: "0.0.0.0"                 # 服务器监听地址
  port: 7000                      # 服务器监听端口
  tokens:                         # Bearer Token 认证白名单列表
    - "123456"                    # 默认测试 Token

# ----------------------------------------------------------------------------
# 任务调度器配置
# ----------------------------------------------------------------------------
scheduler:
  idle_timeout: 10                # 服务空闲超时（秒）
  startup_timeout: 300            # 服务启动超时（秒）
  download_idle_timeout: 10       # 等待客户端下载的超时（秒）

# ----------------------------------------------------------------------------
# 自动启动服务配置
# ----------------------------------------------------------------------------
# 指定 Kalm 启动时自动启动哪些服务（对应 configs/services.yaml 中的服务名称）。
auto_start_services:
  # - "ComfyUI"
  # - "TTS"

# ----------------------------------------------------------------------------
# 路径配置
# ----------------------------------------------------------------------------
paths:
  task_folder: "tasks"            # 任务工作目录

# ----------------------------------------------------------------------------
# 自动清理配置
# ----------------------------------------------------------------------------
auto_cleanup_interval_hours: 0.5  # 清理检查间隔（小时）
auto_cleanup_tasks_time: 4        # 任务保留时间（小时）